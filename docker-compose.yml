services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: picksy-backend
    restart: unless-stopped
    # Bind exclusively to localhost on the host machine.
    # Nginx on the host will reverse-proxy public traffic (80/443) to 127.0.0.1:8000.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, os; sys_port = os.getenv('PORT', '8000'); urllib.request.urlopen(f'http://127.0.0.1:{sys_port}/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
